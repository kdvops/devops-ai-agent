<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DevOps AI Agent</title>
  <style>
    :root{--ink:#eaf0e8;--muted:#aab8ad;--panel:#14221d;--line:#2e463a;--accent:#d6ea4a;--user:#274b40}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 85% 5%,#315a43,transparent 34%),#0b1210;font:16px Georgia,serif}main{width:min(980px,calc(100% - 28px));margin:44px auto}h1{font-size:clamp(2rem,5vw,3.8rem);margin:0;letter-spacing:-.05em}p{color:var(--muted)}.bar,.columns{display:flex;gap:16px}.bar{align-items:center;justify-content:space-between;margin-bottom:25px}.columns{align-items:start}.chat-column{flex:2}.tools{flex:1;background:#14221d;border:1px solid var(--line);border-radius:15px;padding:15px}.identity input{width:160px}#chat{min-height:420px;max-height:62vh;overflow:auto;padding:16px;border:1px solid var(--line);border-radius:15px;background:#14221de0}.msg{white-space:pre-wrap;margin:12px 0;padding:13px 15px;border-radius:10px;line-height:1.45;max-width:88%;overflow:auto}.user{margin-left:auto;background:var(--user)}.agent{background:#20332b}form{display:flex;gap:10px;margin-top:16px}input,textarea{width:100%;font:inherit;color:var(--ink);background:#101b16;border:1px solid var(--line);border-radius:8px;padding:12px}textarea{min-height:180px;resize:vertical}#message{flex:1}button{font:inherit;font-weight:bold;border:0;border-radius:8px;padding:12px 16px;background:var(--accent);color:#17210b;cursor:pointer}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.proposal{border:1px solid #b4bd4d;background:#252c17;padding:14px;border-radius:10px;margin:12px 0}.proposal code{color:#e8f4a2}@media(max-width:720px){.columns{display:block}.tools{margin-top:16px}.bar{align-items:start;flex-direction:column}}
  </style>
</head>
<body><main>
  <div class="bar"><div><h1>DevOps AI Agent</h1><p>Operaciones controladas para Kubernetes.</p></div><label class="identity">Usuario<br><input id="user" value="operator-local" maxlength="128"></label></div>
  <div class="columns"><section class="chat-column"><div id="chat" aria-live="polite"><div class="msg agent">Prueba: “estado del cluster”, “listar pods namespace devops-ai” o “listar archivos”.</div></div><form id="chat-form"><input id="message" required maxlength="12000" autocomplete="off" placeholder="Describe una consulta…"><button>Enviar</button></form></section>
  <aside class="tools"><strong>Aplicar manifiesto</strong><p>Permanece bloqueado hasta aprobarlo y hasta habilitar cambios en el clúster.</p><textarea id="manifest" placeholder="apiVersion: v1&#10;kind: ConfigMap&#10;metadata:&#10;  name: example&#10;  namespace: devops-ai"></textarea><button id="propose" type="button">Proponer cambio</button></aside></div>
</main><script>
const chat=document.querySelector('#chat'),message=document.querySelector('#message'),user=document.querySelector('#user'),manifest=document.querySelector('#manifest');
function add(text,kind){const node=document.createElement('div');node.className='msg '+kind;node.textContent=text;chat.append(node);chat.scrollTop=chat.scrollHeight}
async function api(url,body){const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-user':user.value},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Error inesperado');return data}
function proposal(data){const box=document.createElement('div');box.className='proposal';box.innerHTML='<strong>Confirmación requerida</strong><br><code></code><div><button>Aprobar</button> <button class="secondary">Cancelar</button></div>';box.querySelector('code').textContent=data.tool+' '+JSON.stringify(data.arguments);const[ok,cancel]=box.querySelectorAll('button');async function decide(approved){ok.disabled=cancel.disabled=true;try{const result=await api('/api/confirmations',{proposal_id:data.proposal_id,approved});add(approved?'Acción completada.':'Acción cancelada.','agent');if(result.result)add(JSON.stringify(result.result,null,2),'agent')}catch(error){add(error.message,'agent')}box.remove()}ok.onclick=()=>decide(true);cancel.onclick=()=>decide(false);chat.append(box);chat.scrollTop=chat.scrollHeight}
document.querySelector('#chat-form').onsubmit=async event=>{event.preventDefault();const value=message.value.trim();if(!value)return;message.value='';add(value,'user');try{const result=await api('/api/chat',{message:value});add(result.reply,'agent');if(result.status==='WAITING_CONFIRMATION')proposal(result);if(result.result)add(JSON.stringify(result.result,null,2),'agent')}catch(error){add(error.message,'agent)}};
document.querySelector('#propose').onclick=async()=>{if(!manifest.value.trim())return add('Incluye un manifiesto antes de proponerlo.','agent');try{const result=await api('/api/actions',{tool:'apply_kubernetes_manifest',arguments:{manifest:manifest.value}});proposal(result)}catch(error){add(error.message,'agent)}};
</script></body></html>
