apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-ai-agent
  namespace: devops-ai
spec:
  ingressClassName: nginx
  rules:
    - host: devops-ai.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: devops-ai-agent
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-ai-agent-frontend
                port:
                  name: http
