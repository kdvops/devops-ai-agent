apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devops-ai-agent-workspace
  namespace: devops-ai
spec:
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: devops-ai
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn
