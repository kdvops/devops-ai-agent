apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devops-ai-agent
  namespace: devops-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devops-ai-agent
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops-ai
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
