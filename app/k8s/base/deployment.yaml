apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ai-agent
  namespace: devops-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-ai-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-ai-agent
    spec:
      serviceAccountName: devops-ai-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/kdvops/devops-ai-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: devops-ai-agent-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-ai-agent-secrets
                  key: OPENAI_API_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-ai-data
                  key: POSTGRES_PASSWORD
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-ai-agent-secrets
                  key: GIT_TOKEN
                  optional: true
            - name: GIT_PAT
              valueFrom:
                secretKeyRef:
                  name: devops-ai-agent-secrets
                  key: GIT_PAT
                  optional: true
            - name: GIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-ai-agent-secrets
                  key: GIT_API_KEY
                  optional: true
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-ai-agent-secrets
                  key: GIT_PASSWORD
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: temporary-files
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: devops-ai-agent-workspace
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devops-ai-agent
  namespace: devops-ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devops-ai-agent
  ports:
    - name: http
      port: 80
      targetPort: http
