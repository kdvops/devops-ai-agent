apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ai-agent-worker
  namespace: devops-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-ai-agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-ai-agent-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/REPLACE_WITH_YOUR_ORG/devops-ai-agent:0.2.0
          command: ["python", "worker.py"]
          envFrom:
            - configMapRef:
                name: devops-ai-agent-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-ai-data
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: temporary-files
          emptyDir: {}
