apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-ai-agent-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devops-ai-agent
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-ai
  source:
    repoURL: https://github.com/kdvops/devops-ai-agent.git
    targetRevision: main
    path: app/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-ai
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: postgres
      namespace: devops-ai
      jsonPointers:
        - /spec/volumeClaimTemplates
    - group: apps
      kind: Deployment
      name: devops-ai-agent
      namespace: devops-ai
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: devops-ai-agent-frontend
      namespace: devops-ai
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
