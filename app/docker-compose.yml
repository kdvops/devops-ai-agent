services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081/api
    ports: ["3000:3000"]
    depends_on: [agent]
  agent:
    build: .
    ports: ["8080:8080"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      MODEL: ${MODEL:-gpt-5.5}
      GIT_ALLOWED_HOSTS: ${GIT_ALLOWED_HOSTS:-github.com,gitlab.com,bitbucket.org}
      GIT_USERNAME: ${GIT_USERNAME:-x-access-token}
      GIT_COMMIT_NAME: ${GIT_COMMIT_NAME:-DevOps AI Agent}
      GIT_COMMIT_EMAIL: ${GIT_COMMIT_EMAIL:-devops-ai-agent@local.invalid}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_PAT: ${GIT_PAT:-}
      GIT_API_KEY: ${GIT_API_KEY:-}
      GIT_PASSWORD: ${GIT_PASSWORD:-}
      EXTERNAL_HTTP_ALLOWED_HOSTS: ${EXTERNAL_HTTP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      BROWSER_ALLOWED_HOSTS: ${BROWSER_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SSH_ALLOWED_HOSTS: ${SSH_ALLOWED_HOSTS:-}
      SSH_ALLOWED_COMMANDS: ${SSH_ALLOWED_COMMANDS:-uname,uptime,hostname,whoami,df,free,systemctl status,docker ps,kubectl get,kubectl describe}
      SSH_USERNAME: ${SSH_USERNAME:-}
      SSH_PASSWORD: ${SSH_PASSWORD:-}
      SSH_PRIVATE_KEY_PATH: ${SSH_PRIVATE_KEY_PATH:-}
      SSH_KNOWN_HOSTS: ${SSH_KNOWN_HOSTS:-}
      SSH_STRICT_HOST_KEY_CHECKING: ${SSH_STRICT_HOST_KEY_CHECKING:-true}
      KUBECONFIG: /home/agent/.kube/config
      WORKSPACE_ROOT: /workspace
      KUBERNETES_READ_ONLY: "true"
      ALLOWED_NAMESPACES: "*"
      DATABASE_URL: postgresql+asyncpg://devops:devops@postgres:5432/devops_ai
      REDIS_URL: redis://redis:6379/0
      PERSISTENCE_ENABLED: "true"
    volumes:
      - ./workspace:/workspace
      - ${USERPROFILE}/.kube/config:/home/agent/.kube/config:ro
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
      POSTGRES_DB: devops_ai
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data:
